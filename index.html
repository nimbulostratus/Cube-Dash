        const canvas = document.getElementById("gameCanvas");

        function setSize(w, h) { canvas.width = w; canvas.height = h; }
        function getWidth() { return canvas.width; }
        function getHeight() { return canvas.height; }

        function add(obj) {
            if (!_objects.includes(obj)) _objects.push(obj);
        }
        function remove(obj) {
            const idx = _objects.indexOf(obj);
            if (idx > -1) _objects.splice(idx, 1);
        }

        function setTimer(fn, delay) {
            stopTimer(fn);
            const id = setInterval(fn, delay);
            _timers.set(fn, id);
            return id;
        }
        function stopTimer(fn) {
            if (_timers.has(fn)) {
                clearInterval(_timers.get(fn));
                _timers.delete(fn);
            }
        }

        function keyDownMethod(fn) {
            window.addEventListener("keydown", (e) => {
                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
                    e.preventDefault(); // Stops arrow keys & spacebar from scrolling the browser
                }
                fn(e);
            });
        }
        function keyUpMethod(fn) { window.addEventListener("keyup", fn); }

        function mouseClickMethod(fn) {
            canvas.addEventListener("click", (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                fn({
                    getX: () => (e.clientX - rect.left) * scaleX,
                    getY: () => (e.clientY - rect.top) * scaleY
                });
            });
        }

        class GObject {
            constructor() { this.x = 0; this.y = 0; this.color = "black"; this.layer = 1; }
            setPosition(x, y) { this.x = x; this.y = y; }
            getX() { return this.x; }
            getY() { return this.y; }
            setColor(c) { this.color = c; }
            getColor() { return this.color; }
        }

        class Rectangle extends GObject {
            constructor(w, h) { super(); this.w = w; this.h = h; }
            getWidth() { return this.w; }
            getHeight() { return this.h; }
            getType() { return "Rectangle"; }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);
            }
        }

        class Circle extends GObject {
            constructor(r) { super(); this.r = r; }
            getRadius() { return this.r; }
            getType() { return "Circle"; }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Text extends GObject {
            constructor(text, font) { super(); this.text = text; this.font = font; }
            setText(t) { this.text = t; }
            getWidth() {
                ctx.font = this.font;
                return ctx.measureText(this.text).width;
            }
            getType() { return "Text"; }
            draw() {
                ctx.font = this.font;
                ctx.fillStyle = this.color;
                ctx.fillText(this.text, this.x, this.y);
            }
        }

        // Render loop that sorts by .layer just like CodeHS
        function _renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const sorted = [..._objects].sort((a, b) => (a.layer || 0) - (b.layer || 0));
            for (const obj of sorted) obj.draw();
            requestAnimationFrame(_renderLoop);
        }
        requestAnimationFrame(_renderLoop);

// Checks if you have any save data and pulls it from your cache.
function loadSaveData() {
    let savedWorlds = localStorage.getItem("cubeDash_unlockedWorlds");
    if (savedWorlds) {
        unlockedWorlds = parseInt(savedWorlds);
    }
    let savedTimes = localStorage.getItem("cubeDash_bestTimes");
    if (savedTimes) {
        bestTimes = JSON.parse(savedTimes);
    }
}

// This is your save data for your best times and worlds unlocked, being uploaded to your account.
function saveGameData() {
    localStorage.setItem("cubeDash_unlockedWorlds", unlockedWorlds);
    localStorage.setItem("cubeDash_bestTimes", JSON.stringify(bestTimes));
}

// This turns your best times on each world into a file on your account.
function formatTime(ms) {
    if (!ms) return "--:--.--";
    let minutes = Math.floor((ms / (1000 * 60)) % 60);
    let seconds = Math.floor((ms / 1000) % 60);
    let centiseconds = Math.floor((ms % 1000) / 10);
    return (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds + "." + (centiseconds < 10 ? "0" : "") + centiseconds;
}

function handleMouseClick(e) {
    let mx = e.getX();
    let my = e.getY();

    if (dialog) {
        handleDialogClick(mx, my);
        return;
    }

    if (GAME_STATE == "EDITOR") {
        handleEditorClick(mx, my);
        return;
    }
    
    if (GAME_STATE == "PLAYING" || GAME_STATE == "CUSTOM_PLAY") {
        if (!isPaused) return;
        for (let i = 0; i < pauseButtons.length; i++) {
            let b = pauseButtons[i];
            if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
                if (b.action == "RESUME") {
                    resumeGame();
                } else if (b.action == "RESTART_WORLD") {
                    resumeGame();
                    if (GAME_STATE == "CUSTOM_PLAY") restartCustomRun();
                    else startWorld(currentWorld);
                } else if (b.action == "WORLD_SELECT") {
                    resumeGame();
                    if (GAME_STATE == "CUSTOM_PLAY") exitCustomPlay();
                    else showWorldSelect();
                }
                break;
            }
        }
        return;
    }
   
    for (let i = 0; i < worldButtons.length; i++) {
        let b = worldButtons[i];
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            if (typeof handleCustomWorldAction === "function" && handleCustomWorldAction(b)) {
                break;
            }
            if (b.action == "OPEN_WORLD_SELECT") {
                showWorldSelect();
            } else if (b.action == "OPEN_EDITOR") {
                showCustomWorlds();
            } else if (b.action == "BACK_TO_TITLE") {
                titleScreen();
            } else if (b.action == "START_WORLD") {
                startWorld(b.worldNum);
            } else if (b.action == "RESET_SAVE") {
                localStorage.removeItem("cubeDash_unlockedWorlds");
                localStorage.removeItem("cubeDash_bestTimes");
                unlockedWorlds = 1;
                bestTimes = {};
                showWorldSelect();
            }
            break;
        }
    }
}

function pauseGame() {

    add(title);
    pauseElements.push(title);

    // Helper to build pause buttons
    function makePauseBtn(label, yOffset, bgColor, actionName) {
        let btnW = 220;
        let btnH = 48;
        let btnX = (getWidth() - btnW) / 2;
        let btnY = boxY + yOffset;

        let btn = new Rectangle(btnW, btnH);
        btn.setPosition(btnX, btnY);
        btn.setColor(bgColor);
        btn.layer = 10;
        add(btn);
        pauseElements.push(btn);

        let txt = new Text(label, "14pt Verdana");
        txt.setPosition(btnX + (btnW - txt.getWidth()) / 2, btnY + 31);
        txt.setColor("moccasin");
        txt.layer = 11;
        add(txt);
        pauseElements.push(txt);

        pauseButtons.push({ x: btnX, y: btnY, w: btnW, h: btnH, action: actionName });
    }

    makePauseBtn("RESUME (ESC)", 95, "peru", "RESUME");
    makePauseBtn("RESTART WORLD", 160, "chocolate", "RESTART_WORLD");
    makePauseBtn("WORLD SELECT", 225, "crimson", "WORLD_SELECT");
}

function resumeGame() {
    if (!isPaused) return;
    isPaused = false;
    for (let i = 0; i < pauseElements.length; i++) {
        remove(pauseElements[i]);
    }
    pauseElements = [];
    pauseButtons = [];
    
    // Resume the stopwatch if the player had already started moving
    if (elapsedTime > 0 && !timeFrozen) {
        startStopwatch();
    }
}

function getTotalBestTime() {
    let totalMs = 0;
    let hasAnyTime = false;
    for (let w in bestTimes) {
        if (bestTimes[w]) {
            totalMs += bestTimes[w];
            hasAnyTime = true;
        }
    }
    return hasAnyTime ? formatTime(totalMs) : "--:--.--"
}

    }

    movingUp = false;
    movingDown = false;

    canDash = true;
    isInvulnerable = false;

    }
}

let trackObstacles = [];
let trackLines = [];

function addTrackObstacle(type, points, speed) {
    if (!points || points.length < 2) return;

    for (let i = 0; i < points.length - 1; i++) {
        let p1 = points[i];
        let p2 = points[i + 1];
        let x1 = p1.c * TILE_SIZE + TILE_SIZE / 2;
        let y1 = p1.r * TILE_SIZE + TILE_SIZE / 2;
        let x2 = p2.c * TILE_SIZE + TILE_SIZE / 2;
        let y2 = p2.r * TILE_SIZE + TILE_SIZE / 2;

        let rail = new GObject();
        rail.layer = 1.5;
        rail.draw = function() {
            ctx.save();
            ctx.strokeStyle = "rgba(0, 0, 0, 0.35)";
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            ctx.beginPath();
            ctx.arc(x1, y1, 4, 0, Math.PI * 2);
            ctx.arc(x2, y2, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        };
        add(rail);
        trackLines.push(rail);
    }

    let startX = points[0].c * TILE_SIZE;
    let startY = points[0].r * TILE_SIZE;
    let obj;

    if (type === "C") {
        obj = new Circle(TILE_SIZE / 2);
        obj.setPosition(startX + TILE_SIZE / 2, startY + TILE_SIZE / 2);
    } else {
        obj = new Rectangle(TILE_SIZE, TILE_SIZE);
        obj.setPosition(startX, startY);
    }
    obj.setColor(OBSTACLE_COLOR);
    obj.layer = 2.5;
    add(obj);
    obstacles.push(obj);

    trackObstacles.push({
        obj: obj,
        type: type,
        points: points,
        speed: speed || 2.0,
        segIndex: 0,
        dir: 1,
        progress: 0
    });
}

function updateTrackObstacles() {
    if (timeFrozen) return;

    for (let i = 0; i < trackObstacles.length; i++) {
        let tr = trackObstacles[i];
        let pA = tr.points[tr.segIndex];
        let pB = tr.points[tr.segIndex + tr.dir];
        if (!pA || !pB) continue;

        let ax = pA.c * TILE_SIZE, ay = pA.r * TILE_SIZE;
        let bx = pB.c * TILE_SIZE, by = pB.r * TILE_SIZE;
        let segLen = Math.hypot(bx - ax, by - ay);
        if (segLen === 0) continue;

        tr.progress += tr.speed / segLen;

        while (tr.progress >= 1) {
            tr.progress -= 1;
            tr.segIndex += tr.dir;
            if (tr.segIndex >= tr.points.length - 1) {
                tr.segIndex = tr.points.length - 1;
                tr.dir = -1;
            } else if (tr.segIndex <= 0) {
                tr.segIndex = 0;
                tr.dir = 1;
            }
            pA = tr.points[tr.segIndex];
            pB = tr.points[tr.segIndex + tr.dir];
            ax = pA.c * TILE_SIZE; ay = pA.r * TILE_SIZE;
            bx = pB.c * TILE_SIZE; by = pB.r * TILE_SIZE;
        }

        let curX = ax + (bx - ax) * tr.progress;
        let curY = ay + (by - ay) * tr.progress;

        if (tr.type === "C") {
            tr.obj.setPosition(curX + TILE_SIZE / 2, curY + TILE_SIZE / 2);
        } else {
            tr.obj.setPosition(curX, curY);
        }
    }
}

// Starts the player box object

// Checks which direction keys are being pressed and moves the player in that direction.
function playerDirCheck(e) {
    if (dialog) {
        handleDialogKey(e);
        return;
    }
    if (e.key == "Escape" && (GAME_STATE == "WORLD_SELECT" || GAME_STATE == "CUSTOM_WORLDS")) {
        titleScreen();
        return;
    }

    if (GAME_STATE == "EDITOR") {
        handleEditorKey(e);
        return;
    }

    if (e.key == "Escape" && GAME_STATE == "CUSTOM_PLAY") {
        exitCustomPlay();
        return;
    }
    
	if ((e.key == "Escape" || e.key == "p" || e.key == "P") && (GAME_STATE == "PLAYING" || GAME_STATE == "CUSTOM_PLAY")) {
		if (isPaused) resumeGame();
		else pauseGame();
		return;
	}
    
    if ((GAME_STATE != "PLAYING" && GAME_STATE != "CUSTOM_PLAY") || isPaused) return;

    let k = e.key.toLowerCase();
    if (e.key == "ArrowLeft" || k == "a") {
        movingLeft = true;
        startStopwatch();
    } else if (e.key == "ArrowUp" || k == "w") {
        movingUp = true;
        startStopwatch();
    } else if (e.key == "ArrowRight" || k == "d") {
        movingRight = true;
        startStopwatch();
    } else if (e.key == "ArrowDown" || k == "s") {
        movingDown = true;
        startStopwatch();
    } else if ((e.key == " " || e.key == "Shift" || k == "j" || k == "z") && canDash) {
        dash();
    } else if (e.key == "r" || e.key == "R") {
        if (GAME_STATE == "CUSTOM_PLAY") {
            restartCustomRun();
        } else if (DEBUG_LEVEL != null) {
            clearLevel();
            DEBUG_LEVEL();
            resetPlayerPos();
        } else {
            restart();
        }
    }
}

function playerStopCheck(e) {
    let k = e.key.toLowerCase();
    if (e.key == "ArrowLeft" || k == "a") {
        movingLeft = false;
    } else if (e.key == "ArrowUp" || k == "w") {
        movingUp = false;
    } else if (e.key == "ArrowRight" || k == "d") {
        movingRight = false;
    } else if (e.key == "ArrowDown" || k == "s") {
        movingDown = false;
    }
}

// Resets the player to a set position every time.
function resetPlayerPos() {
    curPlayerX = spawnX;
    curPlayerY = spawnY;
    player.setPosition(curPlayerX, curPlayerY);
}

// Sets the player speed and collision with walls.
function playerMove() {
    if ((GAME_STATE != "PLAYING" && GAME_STATE != "CUSTOM_PLAY") || isPaused) return;

    let currentSpeed = isDash ? DASH_SPEED : SPEED;
    let dx = 0;
    let dy = 0;

    if (movingLeft) dx -= 1;
    if (movingRight) dx += 1;
    if (movingUp) dy -= 1;
    if (movingDown) dy += 1;

    if (dx != 0 && dy != 0) {
        dx *= 0.7071;
        dy *= 0.7071;
    }

    let steps = Math.ceil(currentSpeed / 2);
    let stepX = (dx * currentSpeed) / steps;
    let stepY = (dy * currentSpeed) / steps;

    for (let s = 0; s < steps; s++) {
        curPlayerX += stepX;
        if (curPlayerX < 0) curPlayerX = 0;
        if (curPlayerX + PLAYER_SIZE > getWidth()) curPlayerX = getWidth() - PLAYER_SIZE;

        for (let i = 0; i < walls.length; i++) {
            let w = walls[i];
            if (rectsOverlap(curPlayerX, curPlayerY, PLAYER_SIZE, PLAYER_SIZE, w.getX(), w.getY(), w.getWidth(), w.getHeight())) {
                if (stepX > 0) curPlayerX = w.getX() - PLAYER_SIZE;
                else if (stepX < 0) curPlayerX = w.getX() + w.getWidth();
            }
        }

        curPlayerY += stepY;
        if (curPlayerY < 0) curPlayerY = 0;
        if (curPlayerY + PLAYER_SIZE > getHeight()) curPlayerY = getHeight() - PLAYER_SIZE;

        for (let i = 0; i < walls.length; i++) {
            let w = walls[i];
            if (rectsOverlap(curPlayerX, curPlayerY, PLAYER_SIZE, PLAYER_SIZE, w.getX(), w.getY(), w.getWidth(), w.getHeight())) {
                if (stepY > 0) curPlayerY = w.getY() - PLAYER_SIZE;
                else if (stepY < 0) curPlayerY = w.getY() + w.getHeight();
            }
        }
    }

    player.setPosition(curPlayerX, curPlayerY);
}

// Cooldowns and timers to balance the dash ability. Also turns player white when dashing.
function dash() {
    isDash = true;
    canDash = false;
    player.setColor("white");
    
    setTimeout(endDash, DASH_DURATION);
    setTimeout(resetDash, DASH_COOLDOWN);
}

// Ends the dash and returns the player to the original color
function endDash() {
    isDash = false;
    if (player) {
        player.setColor(PLAYER_COLOR);
    }
}

// Ends the cooldown and allows the player to dash.
function resetDash() {
    canDash = true;
}

function run() {
	if (dialog) return;
	if ((GAME_STATE != "PLAYING" && GAME_STATE != "CUSTOM_PLAY") || isPaused) return;
    
    if (!isDash && !isInvulnerable) {
        checkObstacleCollisions();
    }
    
    checkItemCollisions();
    checkKeyCollisions();
    updateHazardWall();
    updateTrackObstacles();
    
	for (let i = 0; i < doors.length; i++) {
		let d = doors[i];
		if (rectsOverlap(curPlayerX, curPlayerY, PLAYER_SIZE, PLAYER_SIZE, d.getX(), d.getY(), d.getWidth(), d.getHeight())) {
			if (GAME_STATE == "CUSTOM_PLAY") {
				customLevelCleared();
			} else {
				loadNextLevel();
			}
			break;
		}
	}
}

function checkObstacleCollisions() {
    for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        let hit = false;
        
        if (obs.getType() == "Circle") {
            hit = circleRectOverlap(obs.getX(), obs.getY(), obs.getRadius(), curPlayerX, curPlayerY, PLAYER_SIZE, PLAYER_SIZE);
        } else {
            hit = rectsOverlap(curPlayerX, curPlayerY, PLAYER_SIZE, PLAYER_SIZE, obs.getX(), obs.getY(), obs.getWidth(), obs.getHeight());
        }
        
        if (hit) {
            takeDamage();
            break;
        }
    }
}

function checkItemCollisions() {
    for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        if (circleRectOverlap(item.getX(), item.getY(), item.getRadius(), player.getX(), player.getY(), PLAYER_SIZE, PLAYER_SIZE)) {
            applyItemEffect(item.itemType);
            remove(item);
            items.splice(i, 1);
        }
    }
}

function applyItemEffect(type) {
    if (type == "health") {
        if (hp < MAX_HP) {
            hp++;
            hpText.setText("HP: " + hp + "/" + MAX_HP);
        }
	} else if (type == "time") {
		if (!timeFrozen && isRunning) {
			timeFrozen = true;
			stopStopwatch();
			timeText.setColor("cyan");
			clearTimeout(timeFreezeTimeout);
			timeFreezeTimeout = setTimeout(resumeStopwatch, 5000);
		}
	} else if (type == "speed") {
		speedBoost = true;
		SPEED = BOOST_SPEED;
		clearTimeout(speedBoostTimeout);
		speedBoostTimeout = setTimeout(endSpeedBoost, 7000);
	}
}

function checkKeyCollisions() {
    for (let i = keys.length - 1; i >= 0; i--) {
        let k = keys[i];
        if (circleRectOverlap(k.getX(), k.getY(), k.getRadius(), player.getX(), player.getY(), PLAYER_SIZE, PLAYER_SIZE)) {
            remove(k);
            keys.splice(i, 1);
            unlockDoors();
        }
    }
    for (let i = fakeKeys.length - 1; i >= 0; i--) {
        let fk = fakeKeys[i];
        if (circleRectOverlap(fk.getX(), fk.getY(), fk.getRadius(), player.getX(), player.getY(), PLAYER_SIZE, PLAYER_SIZE)) {
            if (!isDash && !isInvulnerable) {
                remove(fk);
                fakeKeys.splice(i, 1);
                takeDamage();
            }
        }
    }
}

function unlockDoors() {
    for (let i = 0; i < lockedDoors.length; i++) {
        let lockDoor = lockedDoors[i];
        remove(lockDoor);
    
        let wallIndex = walls.indexOf(lockDoor);
        if (wallIndex > -1) {
            walls.splice(wallIndex, 1);
        }
    }
    lockedDoors = [];
}

function resumeStopwatch() {
    timeFrozen = false;
    if ((GAME_STATE == "PLAYING" || GAME_STATE == "CUSTOM_PLAY") && timeText) {
        timeText.setColor(GUI_COLOR);
        startStopwatch();
    }
}

function endSpeedBoost() {
    speedBoost = false;
    SPEED = 3.5;
}

function takeDamage() {
    hp--;
    hpText.setText("HP: " + hp + "/" + MAX_HP);
    
    if (hp <= 0) {
        restart();
    } else {
        isInvulnerable = true;
        
        // Clear any existing blink timer in case of rapid hits
        if (invulnBlinkInterval) clearInterval(invulnBlinkInterval);
        
        let blinkOn = true;
        player.setColor("gold");
        
        // Toggle color every 80ms for a rapid blink effect
        invulnBlinkInterval = setInterval(() => {
            if (!player || !isInvulnerable) return;
            if (!isDash) { // Keep the white dash color intact if dashing
                blinkOn = !blinkOn;
                player.setColor(blinkOn ? "gold" : BACKGROUND_COLOR);
            }
        }, 80);
        
        setTimeout(endInvulnerable, TITLE_CARD);
    }
}

function endInvulnerable() {
    isInvulnerable = false;
    if (invulnBlinkInterval) {
        clearInterval(invulnBlinkInterval);
        invulnBlinkInterval = null;
    }
    if (!isDash && player) {
        player.setColor(PLAYER_COLOR);
    }
}

function rectsOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 &&
    x1 + w1 > x2 &&
    y1 < y2 + h2 &&
    y1 + h1 > y2;
}

function circleRectOverlap(cx, cy, radius, rx, ry, rw, rh) {
    let circleX = cx;
    let circleY = cy;
    
    if (cx < rx) circleX = rx;
    else if (cx > rx + rw) circleX = rx + rw;
    if (cy < ry) circleY = ry;
    else if (cy > ry + rh) circleY = ry + rh;
    
    let distanceX = cx - circleX;
    let distanceY = cy - circleY;
    let distance = Math.sqrt((distanceX * distanceX) + (distanceY * distanceY));
    return distance <= radius;
}

function restart() {
	if (GAME_STATE == "CUSTOM_PLAY") {
		restartCustomRun();
		return;
	}
    hp = MAX_HP;
    hpText.setText("HP: " + hp + "/" + MAX_HP);
    movingLeft = false;
    movingRight = false;
    movingUp = false;
    movingDown = false;
    isDash = false;
    canDash = true;
    isInvulnerable = false;
    player.setColor(PLAYER_COLOR);
    
    level = (currentWorld - 1) * LEVELS_PER_WORLD;
    loadNextLevel();
    resetPlayerPos();
	
	if (invulnBlinkInterval) { clearInterval(invulnBlinkInterval); invulnBlinkInterval = null; }
}

function restartCurrentLevel() {
    movingLeft = false;
    movingRight = false;
    movingUp = false;
    movingDown = false;
    isDash = false;
    canDash = true;
    isInvulnerable = false;
    if (player) {
        player.setColor(PLAYER_COLOR);
    }
    
    // Decrement 'level' by 1 because loadNextLevel() increments it after loading
    if (level > 0) {
        level--;
    }
    loadNextLevel();
    resetPlayerPos();
	if (invulnBlinkInterval) { clearInterval(invulnBlinkInterval); invulnBlinkInterval = null; }
}

function clearLevel() {
    for (let i = 0; i < walls.length; i++) {
        remove(walls[i]);
    }
    walls = [];
    
    for (let i = 0; i < obstacles.length; i++) {
        remove(obstacles[i]);
    }
    obstacles = [];
    
    for (let i = 0; i < items.length; i++) {
        remove(items[i]);
    }
    items = [];
    
    for (let i = 0; i < keys.length; i++) {
        remove(keys[i]);
    }
    keys = [];
    
    for (let i = 0; i < fakeKeys.length; i++) {
        remove(fakeKeys[i]);
    }
    fakeKeys = [];
    
    for (let i = 0; i < lockedDoors.length; i++) {
        remove(lockedDoors[i]);
    }
    lockedDoors = [];
    
    if (hazardWall != null) {
        remove(hazardWall);
        hazardWall = null;
        hazardWallSpeed = 0;
    }
	for (let i = 0; i < doors.length; i++) {
    remove(doors[i]);
	}
	doors = [];
	
    trackObstacles = [];
    for (let i = 0; i < trackLines.length; i++) {
        remove(trackLines[i]);
    }
    trackLines = [];
}

function loadNextLevel() {
	if (GAME_STATE == "CUSTOM_PLAY") {
		playCustomLevel({ keepHp: true, keepTime: true });
		return;
	}
    clearLevel();
    
    let endOfCurrentWorld = currentWorld * LEVELS_PER_WORLD;
    
    if (level >= endOfCurrentWorld) {
        stopStopwatch();
        
        if (!bestTimes[currentWorld] || elapsedTime < bestTimes[currentWorld]) {
            bestTimes[currentWorld] = elapsedTime;
        }
        
        if (currentWorld >= unlockedWorlds && unlockedWorlds < TOTAL_WORLDS) {
            unlockedWorlds = currentWorld + 1;
        }
        
        saveGameData();
        showWorldSelect();
        return;
    }
    
    if (level < levels.length) {
        levels[level]();
        level++;
        curPlayerX = spawnX;
        curPlayerY = spawnY;
        player.setPosition(curPlayerX, curPlayerY);
    } else {
        stopStopwatch();
        showWorldSelect();
    }
}

function startStopwatch() {
    if (!isRunning && !timeFrozen) {
        startTime = Date.now() - elapsedTime;
        stopwatch = setTimer(update, 10);
        isRunning = true;
    }
}

function stopStopwatch() {
    if (isRunning) {
        stopTimer(update);
        elapsedTime = Date.now() - startTime;
        isRunning = false;
        stopwatch = null;
    }
}

function resetStopwatch() {
    stopTimer(update);
    stopwatch = null;
    startTime = 0;
    elapsedTime = 0;
    isRunning = false;
    if (timeText) timeText.setText("00:00.00");
}

function update() {
	if (GAME_STATE != "PLAYING" && GAME_STATE != "CUSTOM_PLAY") return;
    
    elapsedTime = Date.now() - startTime;
    
    let minutes = Math.floor((elapsedTime / (1000 * 60)) % 60);
    let seconds = Math.floor((elapsedTime / 1000) % 60);
    let centiseconds = Math.floor((elapsedTime % 1000) / 10);
    
    if (minutes < 10) {
        minutes = "0" + minutes;
    }
    if (seconds < 10) {
        seconds = "0" + seconds;
    }
    if (centiseconds < 10) {
        centiseconds = "0" + centiseconds;
    }
    timeText.setText(minutes + ":" + seconds + ":" + centiseconds);
    timeText.setColor(GUI_COLOR);
    
    if (!timeFrozen) {
        timeText.setColor(GUI_COLOR);
    }
}

// ============================================================
//  LEVEL EDITOR  (Mario Maker style: icon palette, recent bar, all-objects menu)
// ============================================================
let editorGrid = [];
let editorTheme = 1;
let editorHazardSpeed = 0;
let selectedTool = "#";
let isMouseDown = false;
let editorUI = [];
let editorButtons = [];
let editorPanel = null;       // null | "objects" | "hazard" | "colors" | "levels"
let editorSliderDrag = false;
let editorLastSpeed = 0.65;
let editorMenuLayout = null;
let editorMouse = { x: -1, y: -1 };

const EDITOR_TOP_H = 36;
const EDITOR_BOTTOM_H = 48;
const RECENT_SLOTS = 8;
const RECENT_KEY = "cubeDash_editorRecent";

// Every placeable object. To add a new one: add it here, give it an icon in drawToolIcon,
// list it in EDITOR_MENU_SECTIONS, and handle its tile in loadMap().
const EDITOR_TOOLS = [
    { tile: "#", label: "Wall",       desc: "Its a wall." },
    { tile: "X", label: "Block",      desc: "Square obstacle, dash through it." },
    { tile: "C", label: "Orb",        desc: "Circle obstacle, dash through it." },
    { tile: "=", label: "Moving Box", desc: "Drag across tiles to make a moving square." },
    { tile: "O", label: "Moving Orb", desc: "Drag across tiles to make a moving orb." },
    { tile: "D", label: "Door",       desc: "Leads to the next level or the end." },
    { tile: "K", label: "Key",        desc: "Opens locked doors." },
    { tile: "L", label: "Lock",       desc: "Locked door that needs a key." },
    { tile: "F", label: "Fake Key",   desc: "Fake key that hurts you." },
    { tile: "H", label: "+HP",        desc: "Adds 1 HP." },
    { tile: "T", label: "Time",       desc: "Freezes the timer for 5 seconds." },
    { tile: "S", label: "Speed",      desc: "Speed boost for 7 seconds." },
    { tile: "P", label: "Spawn",      desc: "Starting position for the player." },
    { tile: ".", label: "Erase",      desc: "Erases tiles or tracks." }
];

const EDITOR_HAZARD_ENTRY = { tile: "~", label: "Hazard Wall", desc: "Rapidly approaching wall, you cant dash through it btw." };

const EDITOR_MENU_SECTIONS = [
    { col: 0, title: "BUILDING",     items: ["#", "D"] },
    { col: 0, title: "HAZARDS",      items: ["X", "C", "=", "O", "~"] },
    { col: 0, title: "PLAYER",       items: ["P", "."] },
    { col: 1, title: "KEYS & LOCKS", items: ["K", "L", "F"] },
    { col: 1, title: "POWER-UPS",    items: ["H", "T", "S"] }
];

// Most recently picked objects (newest first). Saved between visits.
let editorRecent = ["#", "X", "C", "D", "K", "P"];

function loadEditorRecent() {
    try {
        let saved = JSON.parse(localStorage.getItem(RECENT_KEY));
        if (Array.isArray(saved)) {
            let ok = saved.filter(t => t !== "." && EDITOR_TOOLS.some(x => x.tile === t));
            if (ok.length > 0) editorRecent = ok.slice(0, RECENT_SLOTS);
        }
    } catch (err) {}
}
function saveEditorRecent() {
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(editorRecent)); } catch (err) {}
}
function pushRecent(tile) {
    if (tile === "." || tile === "~") return;
    editorRecent = [tile].concat(editorRecent.filter(t => t !== tile)).slice(0, RECENT_SLOTS);
    saveEditorRecent();
}
loadEditorRecent();

function toolInfo(tile) {
    if (tile === "~") return EDITOR_HAZARD_ENTRY;
    return EDITOR_TOOLS.find(t => t.tile === tile);
}
function selectTool(tile, fromRecentBar) {
    selectedTool = tile;
    // Picking from the recent bar keeps its order; picking anywhere else moves it to the front.
    if (!fromRecentBar) pushRecent(tile);
}

function editorHit(b, mx, my) {
    return mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
}
function editorCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
}
function editorRR(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}
function addEditorLayer(layer, drawFn) {
    let o = new GObject();
    o.draw = drawFn;
    o.layer = layer;
    add(o);
    editorUI.push(o);
    return o;
}

// ------------------------------------------------------------
//  Icons: drawn exactly like the objects in the game (same shapes, colors and
//  proportions, using the current world theme). Only the eraser is a tool icon.
// ------------------------------------------------------------
function drawToolIcon(tile, x, y, s, alpha) {
    ctx.save();
    ctx.globalAlpha = (alpha === undefined) ? 1 : alpha;
    const cx = x + s / 2, cy = y + s / 2;
    const rect = (color) => { ctx.fillStyle = color; ctx.fillRect(x, y, s, s); };
    const circle = (r, color) => {
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    };

    if (tile === "#")      rect(WALL_COLOR);
    else if (tile === "X") rect(OBSTACLE_COLOR);
    else if (tile === "C") circle(s / 2, OBSTACLE_COLOR);
    else if (tile === "D") rect(DOOR_COLOR);
    else if (tile === "L") rect(LOCK_COLOR);
    else if (tile === "K") circle(s / 3, LOCK_COLOR);
    else if (tile === "F") circle(s / 3, FAKE_KEY_COLOR);
    else if (tile === "H") circle(s / 4, "limeGreen");
    else if (tile === "T") circle(s / 4, "cyan");
    else if (tile === "S") circle(s / 4, "yellow");
    else if (tile === "~") rect("orangered");
	else if (tile === "=" || tile === "O") {
        // Draw rail line behind the obstacle icon
        ctx.strokeStyle = "rgba(255,255,255,0.75)";
        ctx.lineWidth = Math.max(2, s * 0.12);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x + s * 0.1, cy);
        ctx.lineTo(x + s * 0.9, cy);
        ctx.stroke();

        const r = s * 0.34;
        if (tile === "=") {
            ctx.fillStyle = OBSTACLE_COLOR;
            ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
        } else {
            circle(r, OBSTACLE_COLOR);
        }
    }
    else if (tile === "P") {
        const ps = s * (PLAYER_SIZE / TILE_SIZE);
        ctx.fillStyle = PLAYER_COLOR;
        ctx.fillRect(cx - ps / 2, cy - ps / 2, ps, ps);
    } else if (tile === ".") {
        // Eraser (a tool, not a game object)
        ctx.translate(cx, cy);
        ctx.rotate(-Math.PI / 4);
        const w = s * 0.66, h = s * 0.36;
        ctx.fillStyle = "#f4a3b5";
        ctx.fillRect(-w / 2, -h / 2, w * 0.62, h);
        ctx.fillStyle = "#eeeeee";
        ctx.fillRect(-w / 2 + w * 0.62, -h / 2, w * 0.38, h);
        ctx.strokeStyle = "rgba(0,0,0,0.5)";
        ctx.lineWidth = Math.max(1, s / 20);
        ctx.strokeRect(-w / 2, -h / 2, w, h);
    }
    ctx.restore();
}

// ------------------------------------------------------------
//  Drawing: cursor preview, bottom palette bar, all-objects menu
// ------------------------------------------------------------
function drawEditorGridLines() {
    ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
    ctx.lineWidth = 1;
    for (let r = 0; r < 15; r++) {
        for (let c = 0; c < 20; c++) {
            ctx.strokeRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
    }
}

function drawEditorCursor() {
    if (editorPanel) return;
    let mx = editorMouse.x, my = editorMouse.y;
    if (mx < 0 || my < EDITOR_TOP_H || my > getHeight() - EDITOR_BOTTOM_H) return;
    let c = Math.floor(mx / TILE_SIZE), r = Math.floor(my / TILE_SIZE);
    if (c < 0 || c >= 20 || r < 0 || r >= 15) return;
    let x = c * TILE_SIZE, y = r * TILE_SIZE;
    if (selectedTool === ".") {
        ctx.fillStyle = "rgba(255, 60, 60, 0.3)";
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
    } else {
        drawToolIcon(selectedTool, x, y, TILE_SIZE, 0.6);
    }
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
}

function drawEditorBottomBar() {
    const W = getWidth();
    const barY = getHeight() - EDITOR_BOTTOM_H;
    ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
    ctx.fillRect(0, barY, W, EDITOR_BOTTOM_H);
    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    ctx.fillRect(0, barY, W, 1);

    const mx = editorMouse.x, my = editorMouse.y;
    const slot = 38, sy = barY + (EDITOR_BOTTOM_H - slot) / 2;

    // Empty recent slots (dashed outlines)
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 1;
    for (let i = editorRecent.length; i < RECENT_SLOTS; i++) {
        editorRR(104 + i * (slot + 6) + 0.5, sy + 0.5, slot - 1, slot - 1, 6);
        ctx.stroke();
    }
    ctx.restore();

    for (const b of editorButtons) {
        if (b.group !== "bar") continue;
        const hover = editorHit(b, mx, my);

        if (b.action === "OPEN_MENU") {
            ctx.fillStyle = hover ? "rgba(255,255,255,0.28)" : "rgba(255,255,255,0.14)";
            editorRR(b.x, b.y, b.w, b.h, 8); ctx.fill();
            ctx.fillStyle = "white";
            for (let gy = 0; gy < 2; gy++) for (let gx = 0; gx < 2; gx++) {
                ctx.fillRect(b.x + 10 + gx * 10, b.y + 9 + gy * 10, 8, 8);
            }
            ctx.font = "bold 13px Verdana";
            ctx.fillText("ALL", b.x + 38, b.y + 24);
            continue;
        }

        // Tool slot (recent or erase)
        const selected = selectedTool === b.tile;
        ctx.fillStyle = BACKGROUND_COLOR;
        editorRR(b.x, b.y, b.w, b.h, 6); ctx.fill();
        drawToolIcon(b.tile, b.x + 5, b.y + 5, b.w - 10);
        if (selected) {
            ctx.strokeStyle = "white"; ctx.lineWidth = 3;
            editorRR(b.x - 1, b.y - 1, b.w + 2, b.h + 2, 7); ctx.stroke();
        } else {
            ctx.strokeStyle = hover ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.25)";
            ctx.lineWidth = hover ? 2 : 1;
            editorRR(b.x, b.y, b.w, b.h, 6); ctx.stroke();
        }
    }

    // Name + description of the selected object
    const info = toolInfo(selectedTool);
    if (info) {
        ctx.fillStyle = "white";
        ctx.font = "bold 12px Verdana";
        ctx.fillText(info.label, 466, barY + 20);
        ctx.fillStyle = "#bbbbbb";
        ctx.font = "10px Verdana";
        ctx.fillText(info.desc, 466, barY + 36);
    }
}

function drawEditorMenu() {
    if (editorPanel !== "objects" || !editorMenuLayout) return;
    const L = editorMenuLayout, p = L.panel;
    const mx = editorMouse.x, my = editorMouse.y;

    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(0, 0, getWidth(), getHeight());

    ctx.fillStyle = "#1f1f1f";
    editorRR(p.x, p.y, p.w, p.h, 14); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    editorRR(p.x, p.y, p.w, p.h, 14); ctx.stroke();

    ctx.fillStyle = "white";
    ctx.font = "bold 16px Verdana";
    ctx.fillText("ALL OBJECTS", p.x + 20, p.y + 34);

    for (const h of L.headers) {
        ctx.fillStyle = "#aaaaaa";
        ctx.font = "bold 11px Verdana";
        ctx.fillText(h.text, h.x, h.y + 12);
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(h.x + ctx.measureText(h.text).width + 8, h.y + 8, h.w - ctx.measureText(h.text).width - 8, 1);
    }

    let hovered = null;
    for (const b of editorButtons) {
        if (b.group !== "menu") continue;
        const hover = editorHit(b, mx, my);

        if (b.action === "CLOSE_MENU") {
            ctx.fillStyle = hover ? "crimson" : "rgba(255,255,255,0.15)";
            editorRR(b.x, b.y, b.w, b.h, 6); ctx.fill();
            ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(b.x + 9, b.y + 9); ctx.lineTo(b.x + b.w - 9, b.y + b.h - 9);
            ctx.moveTo(b.x + b.w - 9, b.y + 9); ctx.lineTo(b.x + 9, b.y + b.h - 9);
            ctx.stroke();
            continue;
        }

        const isHaz = b.tile === "~";
        const selected = isHaz ? editorHazardSpeed > 0 : selectedTool === b.tile;
        if (hover) hovered = b;

        ctx.fillStyle = BACKGROUND_COLOR;
        editorRR(b.x, b.y, b.w, b.h, 10); ctx.fill();
        if (hover) {
            ctx.fillStyle = "rgba(255,255,255,0.18)";
            editorRR(b.x, b.y, b.w, b.h, 10); ctx.fill();
        }
        drawToolIcon(b.tile, b.x + (b.w - 48) / 2, b.y + 10, 48);

        ctx.textAlign = "center";
        ctx.fillStyle = "white";
        ctx.font = "bold 11px Verdana";
        ctx.fillText(toolInfo(b.tile).label, b.x + b.w / 2, b.y + 82);
        ctx.textAlign = "left";

        if (isHaz) {
            ctx.fillStyle = selected ? "limegreen" : "#666";
            editorRR(b.x + b.w - 42, b.y + 6, 37, 14, 7); ctx.fill();
            ctx.fillStyle = selected ? "black" : "white";
            ctx.font = "bold 9px Verdana";
            ctx.textAlign = "center";
            ctx.fillText(selected ? String(editorHazardSpeed) : "OFF", b.x + b.w - 23.5, b.y + 16);
            ctx.textAlign = "left";
        }

        if (selected) {
            ctx.strokeStyle = isHaz ? "limegreen" : "white";
            ctx.lineWidth = 3;
            editorRR(b.x - 1, b.y - 1, b.w + 2, b.h + 2, 11); ctx.stroke();
        }
    }

    // Footer: hovered object's description, or a hint
    ctx.fillStyle = "#cccccc";
    ctx.font = "11px Verdana";
    ctx.fillText(
        hovered ? toolInfo(hovered.tile).label + ": " + toolInfo(hovered.tile).desc
                : "Press M or Esc to close.",
        p.x + 20, p.y + p.h - 14
    );
}

// ------------------------------------------------------------
//  In-game dialogs (the browser's prompt/confirm/alert aren't available here)
// ------------------------------------------------------------
let dialog = null;
let dialogObj = null;
let uiMouse = { x: -1, y: -1 };

function layoutDialog() {
    const d = dialog, W = getWidth(), H = getHeight();
    const bw = 480, pad = 20;
    ctx.font = "12px Verdana";
    let lines = [];
    String(d.text || "").split("\n").forEach(par => {
        let words = par.split(" "), line = "";
        words.forEach(w => {
            let t = line ? line + " " + w : w;
            if (ctx.measureText(t).width > bw - 2 * pad && line) { lines.push(line); line = w; }
            else line = t;
        });
        lines.push(line);
    });
    if (lines.length === 1 && lines[0] === "") lines = [];
    let h = lines.length > 0 ? 48 + lines.length * 18 : 44;
    let input = null;
    if (d.type === "input" || d.type === "code") {
        const ih = d.type === "code" ? 80 : 36;
        input = { rel: h, h: ih };
        h += ih + 16;
    }
    let btnRel = h;
    h += 36 + 20;
    const bx = (W - bw) / 2, by = Math.max(10, (H - h) / 2 - 20);
    let buttons = [];
    let x = bx + bw - pad;
    for (let i = d.buttons.length - 1; i >= 0; i--) {
        const s = d.buttons[i], w = s.w || 110;
        x -= w;
        buttons.unshift({ x: x, y: by + btnRel, w: w, h: 36, label: s.label, color: s.color, run: s.run });
        x -= 10;
    }
    d.layout = {
        box: { x: bx, y: by, w: bw, h: h }, lines: lines, buttons: buttons,
        input: input ? { x: bx + pad, y: by + input.rel, w: bw - 2 * pad, h: input.h } : null
    };
}

// The level-code box is a real text box laid over the canvas, so the player can
// highlight the code, copy it with Ctrl+C, and paste another with Ctrl+V.
function createDialogDom() {
    try {
        const ta = document.createElement("textarea");
        ta.value = dialog.value;
        ta.spellcheck = false;
        ta.setAttribute("autocomplete", "off");
        ta.setAttribute("autocapitalize", "off");
        Object.assign(ta.style, {
            position: "fixed", zIndex: "1000", boxSizing: "border-box", background: "#111111",
            color: "white", border: "2px solid white", borderRadius: "8px", padding: "8px",
            font: "12px monospace", resize: "none", outline: "none", overflow: "auto"
        });
        // Keep the game from reacting to keys typed in the box
        ta.addEventListener("keydown", (e) => {
            e.stopPropagation();
            if (e.key === "Escape") { e.preventDefault(); dialogRun("cancel"); }
            else if (e.key === "Enter") { e.preventDefault(); dialogRun("ok"); }
        });
        ta.addEventListener("keyup", (e) => e.stopPropagation());
        document.body.appendChild(ta);
        dialog.dom = ta;
        positionDialogDom();
        ta.focus();
        ta.select();
    } catch (err) {
        dialog.dom = null;
    }
}
function positionDialogDom() {
    const d = dialog;
    if (!d || !d.dom || !d.layout || !d.layout.input) return;
    const r = canvas.getBoundingClientRect();
    const sx = r.width / canvas.width, sy = r.height / canvas.height, f = d.layout.input;
    const st = d.dom.style;
    st.left = (r.left + f.x * sx) + "px";
    st.top = (r.top + f.y * sy) + "px";
    st.width = (f.w * sx) + "px";
    st.height = (f.h * sy) + "px";
}
function removeDialogDom() {
    if (dialog && dialog.dom) {
        try { dialog.dom.blur(); document.body.removeChild(dialog.dom); } catch (err) {}
        dialog.dom = null;
    }
}

function showDialog(d) {
    closeDialogSilently();
    movingLeft = movingRight = movingUp = movingDown = false;
    dialog = d;
    layoutDialog();
    dialogObj = new GObject();
    dialogObj.draw = drawDialog;
    dialogObj.layer = 60;
    add(dialogObj);
    if (d.type === "code") createDialogDom();
}
function closeDialogSilently() {
    removeDialogDom();
    if (dialogObj) { remove(dialogObj); dialogObj = null; }
    dialog = null;
}
function dialogRun(run) {
    const d = dialog;
    if (!d) return;
    if (d.dom) d.value = d.dom.value;
    if (typeof run === "function") { run(d); return; }
    closeDialogSilently();
    if (run === "ok" && d.onOk) d.onOk(d.value);
    if (run === "cancel" && d.onCancel) d.onCancel();
}

function askText(title, initial, onOk, opts) {
    opts = opts || {};
    showDialog({
        type: "input", title: title, text: opts.hint || "", value: String(initial === undefined ? "" : initial),
        maxLen: opts.maxLen || 24, filter: opts.filter || null, onOk: onOk,
        buttons: [{ label: "CANCEL", color: "#555", run: "cancel" }, { label: "OK", color: "forestgreen", run: "ok" }]
    });
}
function askConfirm(title, text, onYes, yesLabel) {
    showDialog({
        type: "confirm", title: title, text: text, onOk: onYes,
        buttons: [{ label: "CANCEL", color: "#555", run: "cancel" }, { label: yesLabel || "YES", color: "crimson", run: "ok" }]
    });
}
function showMessage(title, text, onOk) {
    showDialog({
        type: "message", title: title, text: text, onOk: onOk, onCancel: onOk,
        buttons: [{ label: "OK", color: "forestgreen", run: "ok" }]
    });
}

function copyToClipboard(text) {
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).then(() => true, () => false);
        }
    } catch (err) {}
    try {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return Promise.resolve(ok);
    } catch (err) {}
    return Promise.resolve(false);
}

function dialogAppend(str, replace) {
    const d = dialog;
    if (!d || d.type === "confirm" || d.type === "message") return;
    let clean = "";
    for (const ch of String(str).replace(/[\r\n]+/g, "")) {
        if (!d.filter || d.filter.test(ch)) clean += ch;
    }
    d.value = (replace ? clean : d.value + clean).slice(0, d.maxLen);
    d.note = "";
}

function handleDialogKey(e) {
    const d = dialog;
    if (!d) return;
    if (e.key === "Escape") { dialogRun(d.type === "message" ? "ok" : "cancel"); return; }
    if (e.key === "Enter") { dialogRun("ok"); return; }
    if (d.type === "confirm" || d.type === "message" || d.dom) return;
    if (e.key === "Backspace") { d.value = d.value.slice(0, -1); d.note = ""; return; }
    if (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey) dialogAppend(e.key, false);
}
function handleDialogClick(mx, my) {
    const d = dialog;
    if (!d || !d.layout) return;
    for (const b of d.layout.buttons) {
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) { dialogRun(b.run); return; }
    }
}
window.addEventListener("paste", (e) => {
    if (!dialog || (dialog.type !== "input" && dialog.type !== "code") || dialog.dom) return;
    const text = e.clipboardData && e.clipboardData.getData ? e.clipboardData.getData("text") : "";
    if (text) dialogAppend(text, !!dialog.pasteReplaces);
});
canvas.addEventListener("mousemove", (e) => {
    const p = editorCanvasPos(e);
    uiMouse.x = p.x;
    uiMouse.y = p.y;
});

function drawDialog() {
    const d = dialog;
    if (!d || !d.layout) return;
    positionDialogDom();
    const L = d.layout, bx = L.box;
    ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
    ctx.fillRect(0, 0, getWidth(), getHeight());
    ctx.fillStyle = "#1f1f1f";
    editorRR(bx.x, bx.y, bx.w, bx.h, 14); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 2;
    editorRR(bx.x, bx.y, bx.w, bx.h, 14); ctx.stroke();

    ctx.fillStyle = "white";
    ctx.font = "bold 16px Verdana";
    ctx.fillText(d.title, bx.x + 20, bx.y + 34);
    ctx.fillStyle = "#cccccc";
    ctx.font = "12px Verdana";
    L.lines.forEach((ln, i) => ctx.fillText(ln, bx.x + 20, bx.y + 62 + i * 18));

    if (L.input) {
        const f = L.input;
        ctx.fillStyle = "#111111";
        editorRR(f.x, f.y, f.w, f.h, 8); ctx.fill();
        ctx.strokeStyle = "white"; ctx.lineWidth = 2;
        editorRR(f.x, f.y, f.w, f.h, 8); ctx.stroke();
        if (!d.dom) {
        let shown = d.value;
        if (d.compact && shown.length > 44) shown = shown.slice(0, 40) + "… (" + d.value.length + " chars)";
        ctx.font = "14px Verdana";
        while (shown.length > 1 && ctx.measureText(shown).width > f.w - 28 && !d.compact) shown = shown.slice(1);
        ctx.fillStyle = "white";
        ctx.fillText(shown, f.x + 12, f.y + 24);
        if (Math.floor(Date.now() / 500) % 2 === 0 && !d.compact) {
            ctx.fillRect(f.x + 12 + ctx.measureText(shown).width + 2, f.y + 9, 2, 18);
        }
        }
        if (d.note) {
            ctx.fillStyle = "limegreen";
            ctx.font = "11px Verdana";
            ctx.fillText(d.note, f.x, f.y + f.h + 13);
        }
    }

    for (const b of L.buttons) {
        const hover = uiMouse.x >= b.x && uiMouse.x <= b.x + b.w && uiMouse.y >= b.y && uiMouse.y <= b.y + b.h;
        ctx.fillStyle = b.color;
        editorRR(b.x, b.y, b.w, b.h, 8); ctx.fill();
        if (hover) {
            ctx.fillStyle = "rgba(255,255,255,0.22)";
            editorRR(b.x, b.y, b.w, b.h, 8); ctx.fill();
        }
        ctx.fillStyle = "white";
        ctx.font = "bold 12px Verdana";
        ctx.textAlign = "center";
        ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 4);
        ctx.textAlign = "left";
    }
}

const CUSTOM_WORLDS_KEY = "cubeDash_customWorlds";
const MAX_CUSTOM_LEVELS = 24;
let customWorlds = [];
let activeWorldIdx = -1;
let activeLevelIdx = 0;
let customRun = { mode: "test", worldIdx: -1, levelIdx: 0 };
let customPage = 0;

function cleanName(s, fallback) {
    s = String(s === null || s === undefined ? "" : s).trim().slice(0, 24);
    return s || fallback;
}

function blankGridStrings() {
    let rows = [];
    for (let r = 0; r < 15; r++) {
        let row = "";
        for (let c = 0; c < 20; c++) row += (r == 0 || r == 14 || c == 0 || c == 19) ? "#" : ".";
        rows.push(row);
    }
    rows[7] = "#P" + ".".repeat(17) + "D";
    return rows;
}

function blankLevelData(theme) {
    return { name: "", grid: blankGridStrings(), theme: theme || 1, speed: 0, tracks: [] };
}

function sanitizeTracks(raw) {
    if (!Array.isArray(raw)) return [];
    return raw
        .filter(t => t && Array.isArray(t.points) && t.points.length >= 2)
        .map(t => ({
            type: t.type === "C" ? "C" : "X",
            speed: Math.max(0.1, Math.min(20, parseFloat(t.speed) || 2.0)),
            points: t.points.map(p => ({
                c: Math.max(0, Math.min(19, parseInt(p.c) || 0)),
                r: Math.max(0, Math.min(14, parseInt(p.r) || 0))
            }))
        }));
}

function loadCustomWorlds() {
    try {
        let saved = JSON.parse(localStorage.getItem(CUSTOM_WORLDS_KEY));
        if (Array.isArray(saved)) {
            customWorlds = saved
                .filter(w => w && Array.isArray(w.levels) && w.levels.length > 0)
                .map(w => ({
                    name: cleanName(w.name, "Untitled"),
                    bestTime: typeof w.bestTime === "number" && w.bestTime > 0 ? w.bestTime : null,
                    levels: w.levels.map(l => ({
                        name: cleanName(l && l.name, ""),
                        grid: (l && Array.isArray(l.grid) && l.grid.length === 15) ? l.grid.map(String) : blankGridStrings(),
                        theme: Math.max(1, Math.min(TOTAL_WORLDS, parseInt(l && l.theme) || 1)),
                        speed: Math.max(0, parseFloat(l && l.speed) || 0),
                        tracks: sanitizeTracks(l && l.tracks)
                    }))
                }));
        }
    } catch (err) {}
}

function saveCustomWorlds() {
    try { localStorage.setItem(CUSTOM_WORLDS_KEY, JSON.stringify(customWorlds)); } catch (err) {}
}
loadCustomWorlds();

function commitEditorLevel() {
    let w = customWorlds[activeWorldIdx];
    if (!w) return;
    let lv = w.levels[activeLevelIdx];
    if (!lv) return;
    lv.grid = editorGrid.map(r => r.join(""));
    lv.theme = editorTheme;
    lv.speed = editorHazardSpeed;
    // Only save tracks that have at least 2 waypoints
    lv.tracks = sanitizeTracks(editorTracks);
    saveCustomWorlds();
}

function loadEditorLevel(wi, li) {
    activeWorldIdx = wi;
    activeLevelIdx = li;
    let lv = customWorlds[wi].levels[li];
    editorGrid = lv.grid.map(s => s.split(""));
    editorTheme = lv.theme;
    editorHazardSpeed = lv.speed;
    editorTracks = sanitizeTracks(lv.tracks);
    activeTrackIdx = editorTracks.length > 0 ? 0 : -1;
    if (lv.speed > 0) editorLastSpeed = lv.speed;
}

function startEditWorld(wi) {
    loadEditorLevel(wi, 0);
    openLevelEditor();
}
function startWorldRun(wi) {
    customRun = { mode: "world", worldIdx: wi, levelIdx: 0 };
    playCustomLevel();
}

function csText(str, font, x, y, color, centered) {
    let t = new Text(str, font);
    t.setPosition(centered ? (getWidth() - t.getWidth()) / 2 : x, y);
    t.setColor(color);
    t.layer = 6;
    add(t);
    uiElements.push(t);
    return t;
}
function csButton(label, x, y, w, h, color, font, dy, action, extra) {
    let r = new Rectangle(w, h);
    r.setPosition(x, y);
    r.setColor(color);
    r.layer = 5;
    add(r);
    uiElements.push(r);
    let t = new Text(label, font);
    t.setPosition(x + (w - t.getWidth()) / 2, y + h / 2 + dy);
    t.setColor("moccasin");
    t.layer = 6;
    add(t);
    uiElements.push(t);

    worldButtons.push(b);
}

function showCustomWorlds() {

    csButton("NEW WORLD", 170, 470, 220, 50, "peru", "13pt Verdana", 6, "CW_NEW");
    csButton("IMPORT", 410, 470, 220, 50, "teal", "13pt Verdana", 6, "CW_IMPORT");
    csButton("BACK", 20, 20, 90, 36, "crimson", "11pt Verdana", 5, "BACK_TO_TITLE");
}

// Returns true if it handled the button
function handleCustomWorldAction(b) {
    if (b.action === "CW_NEW") {
        askText("Name your new world", "My World " + (customWorlds.length + 1), (name) => {
            customWorlds.push({ name: cleanName(name, "My World " + (customWorlds.length + 1)), bestTime: null, levels: [blankLevelData(1)] });
            saveCustomWorlds();
            startEditWorld(customWorlds.length - 1);
        }, { maxLen: 24 });
        return true;
    }
    if (b.action === "CW_IMPORT") {
        openImportWorldPrompt();
        return true;
    }
    if (b.action === "CW_EXPORT") {
        openExportWorldPrompt(b.wi);
        return true;
    }
    if (b.action === "CW_EDIT") { startEditWorld(b.wi); return true; }
    if (b.action === "CW_PLAY") { startWorldRun(b.wi); return true; }
    if (b.action === "CW_DELETE") {
        askConfirm("Delete world?", "Delete \"" + customWorlds[b.wi].name + "\" and all of its levels?", () => {
            customWorlds.splice(b.wi, 1);
            saveCustomWorlds();
            showCustomWorlds();
        }, "DELETE");
        return true;
    }
    if (b.action === "CW_PREV") { customPage--; showCustomWorlds(); return true; }
    if (b.action === "CW_NEXT") { customPage++; showCustomWorlds(); return true; }
    return false;
}

function setHazardSpeed(v) {
    v = Math.max(0, Math.min(99, Math.round(v * 100) / 100));

    renderEditor();

function openExportWorldPrompt(wi) {
    const world = customWorlds[wi];
    if (!world) return;

    const bytes = [];
    pushTextBytes(bytes, world.name);
    bytes.push(world.levels.length);
    for (const lv of world.levels) {
        pushTextBytes(bytes, lv.name || "");
        const lvBytes = encodeLevelBytes(lv.grid, lv.theme, lv.speed, lv.tracks);
        for (const b of lvBytes) bytes.push(b);
    }
    bytes.push(levelChecksum(bytes));
    const code = WORLD_CODE_PREFIX + bytesToB64(bytes);

    showDialog({
        type: "code", title: "Export: " + world.name, value: code, maxLen: 25000, note: "",
        compact: true, pasteReplaces: false,
        text: "Click COPY or Ctrl+C to copy this world's code.",
        onOk: () => {},
        buttons: [
            { label: "CLOSE", color: "#555", run: "cancel" },
            { label: "COPY", color: "teal", run: (d) => {
                let ok = false;
                if (d.dom) {
                    try { d.dom.focus(); d.dom.select(); ok = document.execCommand("copy"); } catch (err) {}
                }
                if (ok) { d.note = "Copied to clipboard"; return; }
                copyToClipboard(d.dom ? d.dom.value : d.value).then((ok2) => {
                    d.note = ok2 ? "Copied to clipboard" : "Press Ctrl+C to copy the code.";
                });
                if (d.dom) { d.dom.focus(); d.dom.select(); }
            } }
        ]
    });
}

function drawPanelFrame(title) {
    const p = editorMenuLayout.panel;
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(0, 0, getWidth(), getHeight());
    ctx.fillStyle = "#1f1f1f";
    editorRR(p.x, p.y, p.w, p.h, 14); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    editorRR(p.x, p.y, p.w, p.h, 14); ctx.stroke();
    ctx.fillStyle = "white";
    ctx.font = "bold 16px Verdana";
    ctx.fillText(title, p.x + 20, p.y + 34);
    for (const b of editorButtons) {
        if (!b.isX) continue;
        const hover = editorHit(b, editorMouse.x, editorMouse.y);
        ctx.fillStyle = hover ? "crimson" : "rgba(255,255,255,0.15)";
        editorRR(b.x, b.y, b.w, b.h, 6); ctx.fill();
        ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(b.x + 9, b.y + 9); ctx.lineTo(b.x + b.w - 9, b.y + b.h - 9);
        ctx.moveTo(b.x + b.w - 9, b.y + 9); ctx.lineTo(b.x + 9, b.y + b.h - 9);

}
function drawPanelBtn(b) {
    const hover = editorHit(b, editorMouse.x, editorMouse.y);

    editorRR(b.x, b.y, b.w, b.h, 8); ctx.fill();

function drawHazardPanel() {
    drawPanelFrame("HAZARD WALL SPEED");
    const p = editorMenuLayout.panel, s = editorMenuLayout.slider;
    for (const b of editorButtons) {
        if (b.group === "menu" && b.label) drawPanelBtn(b);
    }
    // readout
    const v = editorHazardSpeed;
    ctx.textAlign = "center";
    ctx.fillStyle = v > 0 ? "orangered" : "#888";
    ctx.font = "bold 32px Verdana";
    ctx.fillText(v > 0 ? String(v) : "OFF", p.x + 270, p.y + 96);
    ctx.fillStyle = "#bbbbbb";
    ctx.font = "11px Verdana";
    ctx.fillText(v > 0 ? "pixels per tick  |  " + (Math.round(v * 2.5 * 100) / 100) + " tiles per second" : "hazard wall is off", p.x + 270, p.y + 118);
    ctx.textAlign = "left";
    // slider
    ctx.fillStyle = "#444";
    editorRR(s.x, s.y - 3, s.w, 6, 3); ctx.fill();
    const t = Math.max(0, Math.min(1, v / 3));
    if (t > 0) {
        ctx.fillStyle = "orangered";
        editorRR(s.x, s.y - 3, s.w * t, 6, 3); ctx.fill();
    }
    ctx.fillStyle = "#999";
    ctx.font = "10px Verdana";
    ctx.textAlign = "center";
    for (let k = 0; k <= 3; k++) ctx.fillText(String(k), s.x + (s.w * k) / 3, s.y + 26);
    ctx.textAlign = "left";
    ctx.fillStyle = "white";
    ctx.beginPath(); ctx.arc(s.x + s.w * t, s.y, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = v > 0 ? "orangered" : "#888";
    ctx.lineWidth = 3;
    ctx.stroke();
    if (v > 3) {
        ctx.fillStyle = "#bbbbbb";
        ctx.font = "10px Verdana";
        ctx.fillText("set by typing", s.x + s.w - 170, s.y - 14);
    }

function drawLevelThumb(rows, themeNum, x, y, px) {
    const th = WORLD_THEMES[themeNum] || DEFAULT_THEME;
    ctx.fillStyle = th.bg;
    ctx.fillRect(x, y, 20 * px, 15 * px);
    for (let r = 0; r < 15; r++) {
        for (let c = 0; c < 20; c++) {
            const t = rows[r] ? rows[r][c] : ".";
            let col = null;
            if (t === "#") col = th.wall;
            else if (t === "X" || t === "C") col = "crimson";
            else if (t === "D") col = th.door;
            else if (t === "L" || t === "K") col = LOCK_COLOR;
            else if (t === "F") col = FAKE_KEY_COLOR;
            else if (t === "H") col = "limeGreen";
            else if (t === "T") col = "cyan";
            else if (t === "S") col = "yellow";
            else if (t === "P") col = th.player;
            if (col) { ctx.fillStyle = col; ctx.fillRect(x + c * px, y + r * px, px, px); }
        }
    }
}

function initBlankEditorGrid() {

}

function openLevelEditor() {
    if (activeWorldIdx < 0 || !customWorlds[activeWorldIdx]) {
        showCustomWorlds();
        return;
    }
    GAME_STATE = "EDITOR";
    isPaused = false;
    editorPanel = null;
    stopStopwatch();
    clearLevel();
    hideGameplayUI();
    clearMenuUI();
    clearEditorUI();
    if (editorGrid.length === 0) initBlankEditorGrid();
    renderEditor();
}

function exitEditor() {
    commitEditorLevel();
    editorPanel = null;
    clearEditorUI();
    showCustomWorlds();
}

function clearEditorUI() {
    for (let i = 0; i < editorUI.length; i++) {
        remove(editorUI[i]);
    }
    editorUI = [];
    editorButtons = [];
    editorMenuLayout = null;
}

function buildEditorBottomButtons() {
    const barY = getHeight() - EDITOR_BOTTOM_H;
    const slot = 38, sy = barY + (EDITOR_BOTTOM_H - slot) / 2;

    editorButtons.push({ x: 10, y: sy, w: 84, h: slot, action: "OPEN_MENU", group: "bar" });

            action: "SELECT_RECENT", tile: editorRecent[i], group: "bar"
        });
    }

    // The eraser is always one click away, like in Mario Maker
    editorButtons.push({
        x: getWidth() - 10 - slot, y: sy, w: slot, h: slot,
        action: "SELECT_TOOL", tile: ".", group: "bar"
    });
}

function renderEditor() {
    clearLevel();
    clearEditorUI();

    let theme = WORLD_THEMES[editorTheme] || DEFAULT_THEME;
    BACKGROUND_COLOR = theme.bg;
    WALL_COLOR = theme.wall;
    PLAYER_COLOR = theme.player;
    OBSTACLE_COLOR = "crimson";
    DOOR_COLOR = theme.door;
    GUI_COLOR = theme.gui;
    background.setColor(BACKGROUND_COLOR);

    // Build map strings and use the real game's loadMap() so it looks 100% authentic
    let mapStrings = editorGrid.map(row => row.join(""));

    // Temporarily create dummy player if needed for "P" tile preview
    if (!player) {
        player = new Rectangle(PLAYER_SIZE, PLAYER_SIZE);
        player.setColor(PLAYER_COLOR);
        player.layer = 3;
        add(player);
    }
    loadMap(mapStrings);
	
	    for (let i = 0; i < editorTracks.length; i++) {
        let tr = editorTracks[i];
        if (tr.points.length >= 2) {
			addTrackObstacle(tr.type, tr.points, 0);
		} else if (tr.points.length === 1) {
			addTrackObstacle(tr.type, [tr.points[0], tr.points[0]], 0);
		}
		if (i === activeTrackIdx && tr.points.length > 0) {
			let p0 = tr.points[0];
			addEditorLayer(4.5, () => {
				ctx.strokeStyle = "gold";
				ctx.lineWidth = 3;
				ctx.strokeRect(p0.c * TILE_SIZE + 2, p0.r * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
			});
		}
    }

    // Position player marker accurately on the 'P' tile
    for (let r = 0; r < 15; r++) {
        for (let c = 0; c < 20; c++) {
            if (editorGrid[r][c] === "P") {
                player.setPosition(
                    c * TILE_SIZE + (TILE_SIZE - PLAYER_SIZE) / 2,
                    r * TILE_SIZE + (TILE_SIZE - PLAYER_SIZE) / 2
                );
            }
        }
    }

    // Subtle grid lines + hovered-cell preview
    addEditorLayer(4, drawEditorGridLines);
    addEditorLayer(7, drawEditorCursor);

    // Top HUD Bar
    let topBar = new Rectangle(getWidth(), EDITOR_TOP_H);
    topBar.setPosition(0, 0);
    topBar.setColor("rgba(0, 0, 0, 0.75)");
    topBar.layer = 8;
    add(topBar);
    editorUI.push(topBar);

    let world = customWorlds[activeWorldIdx];
    let title = world
        ? world.name.slice(0, 18) + " | Level " + (activeLevelIdx + 1) + "/" + world.levels.length
        : "Level Editor";
    let modeLabel = new Text(title, "10pt Verdana");
    modeLabel.setPosition(12, 23);
    modeLabel.setColor("moccasin");
    modeLabel.layer = 9;
    add(modeLabel);
    editorUI.push(modeLabel);

    function addTopBtn(text, x, w, color, action) {
        let btn = new Rectangle(w, 26);
        btn.setPosition(x, 5);
        btn.setColor(color);
        btn.layer = 9;
        add(btn);
        editorUI.push(btn);

        let lbl = new Text(text, "9pt Verdana");
        lbl.setPosition(x + (w - lbl.getWidth()) / 2, 22);
        lbl.setColor("white");
        lbl.layer = 10;
        add(lbl);
        editorUI.push(lbl);

        editorButtons.push({ x: x, y: 5, w: w, h: 26, action: action, group: "top" });
    }

    const topDefs = [
        ["LEVELS", 64, "slateblue", "OPEN_LEVELS"],
        ["COLORS", 64, "#9a5fd6", "OPEN_COLORS"],
		["TRACK", 58, activeTrackIdx >= 0 ? "darkorange" : "#555", "OPEN_TRACK"],
        ["WALL", 52, editorHazardSpeed > 0 ? "orangered" : "#555", "OPEN_HAZARD"],
        ["CLEAR", 54, "#555", "CLEAR_MAP"],
        ["EXPORT", 50, "teal", "CODE_MENU"],
        ["PLAY", 54, "forestgreen", "TEST_PLAY"],
        ["EXIT", 50, "crimson", "EXIT_EDITOR"]
    ];
    let tx = getWidth() - 8;
    for (let i = topDefs.length - 1; i >= 0; i--) {
        tx -= topDefs[i][1];
        addTopBtn(topDefs[i][0], tx, topDefs[i][1], topDefs[i][2], topDefs[i][3]);
        tx -= 6;
    }

    // Bottom palette: [ALL] [recent objects ...]   info   [eraser]
    buildEditorBottomButtons();
    addEditorLayer(11, drawEditorBottomBar);

    // Popup panels on top of everything
    if (editorPanel) {
        buildEditorPanel();
        addEditorLayer(20, drawEditorPanel);
    }
}

// ------------------------------------------------------------
//  Input
// ------------------------------------------------------------
function findTrackAt(c, r) {
    for (let i = editorTracks.length - 1; i >= 0; i--) {
        if (editorTracks[i].points.some(p => p.c === c && p.r === r)) return i;
    }
    return -1;
}

function paintTileAt(mx, my, isInitialClick) {
    if (editorPanel) return;
    if (my < EDITOR_TOP_H || my > getHeight() - EDITOR_BOTTOM_H) return;
    let c = Math.floor(mx / TILE_SIZE);
    let r = Math.floor(my / TILE_SIZE);
    if (r < 0 || r >= 15 || c < 0 || c >= 20) return;

    // 1. Track Box ("=") or Track Orb ("O")
    if (selectedTool === "=" || selectedTool === "O") {
        const trackType = selectedTool === "=" ? "X" : "C";
        if (isInitialClick) {
            const hitIdx = findTrackAt(c, r);
            if (hitIdx >= 0 && editorTracks[hitIdx].points.length >= 2) {
                // Clicking an existing track selects it so you can adjust its speed
                activeTrackIdx = hitIdx;
                renderEditor();
                return;
            }
            // Start a brand-new track
            editorTracks.push({
                type: trackType,
                speed: editorLastTrackSpeed,
                points: [{ c, r }]
            });
            activeTrackIdx = editorTracks.length - 1;
            renderEditor();
        } else if (activeTrackIdx >= 0 && editorTracks[activeTrackIdx]) {
            let pts = editorTracks[activeTrackIdx].points;
            let last = pts[pts.length - 1];
            if (last.c === c && last.r === r) return;
            // If dragging back onto the previous point, undo the last step
            if (pts.length >= 2 && pts[pts.length - 2].c === c && pts[pts.length - 2].r === r) {
                pts.pop();
            } else {
                pts.push({ c, r });
            }
            renderEditor();
        }
        return;
    }

    // 2. Eraser removes a track if one is under the cursor
    if (selectedTool === ".") {
        const hitIdx = findTrackAt(c, r);
        if (hitIdx >= 0) {
            editorTracks.splice(hitIdx, 1);
            activeTrackIdx = editorTracks.length > 0 ? Math.min(activeTrackIdx, editorTracks.length - 1) : -1;
            renderEditor();
            return;
        }
    }

    // 3. Normal single-tile placement
    if (selectedTool === "P") {
        for (let rr = 0; rr < 15; rr++) {
            for (let cc = 0; cc < 20; cc++) {
                if (editorGrid[rr][cc] === "P") editorGrid[rr][cc] = ".";
            }
        }
    }

    if (editorGrid[r][c] !== selectedTool) {
        editorGrid[r][c] = selectedTool;
        renderEditor();
    }
}


function activeEditorButtons() {
    return editorButtons.filter(btn => editorPanel ? btn.group === "menu" : true);
}

function handleEditorClick(mx, my) {
    let b = activeEditorButtons().find(btn => editorHit(btn, mx, my));

    if (!b) {
        if (editorPanel) {
            // Clicking the dark area outside the panel closes it
            let p = editorMenuLayout.panel;
            if (mx < p.x || mx > p.x + p.w || my < p.y || my > p.y + p.h) {
                editorPanel = null;
                renderEditor();
            }
            return;
        }
		paintTileAt(mx, my, true);
        if (GAME_STATE === "EDITOR") commitEditorLevel();
        return;
    }

    const world = customWorlds[activeWorldIdx];
    switch (b.action) {
        case "OPEN_MENU":    editorPanel = "objects"; renderEditor(); break;
        case "OPEN_LEVELS":  editorPanel = "levels"; renderEditor(); break;
        case "OPEN_COLORS":  editorPanel = "colors"; renderEditor(); break;
        case "OPEN_HAZARD":  editorPanel = "hazard"; renderEditor(); break;
        case "CLOSE_MENU":   editorPanel = null; renderEditor(); break;
        case "MENU_PICK":    selectTool(b.tile, false); editorPanel = null; renderEditor(); break;
        case "SELECT_RECENT": selectTool(b.tile, true); renderEditor(); break;
        case "SELECT_TOOL":  selectTool(b.tile, false); renderEditor(); break;
        case "PICK_THEME":   editorTheme = b.theme; editorPanel = null; renderEditor(); break;

        case "HZ_TOGGLE":    setHazardSpeed(editorHazardSpeed > 0 ? 0 : (editorLastSpeed || 0.65)); break;
        case "HZ_STEP":      setHazardSpeed(editorHazardSpeed + b.delta); break;
        case "HZ_SET":       setHazardSpeed(b.value); break;
        case "HZ_SLIDER":    setHazardFromX(mx); break;
        case "HZ_TYPE":
            askText("Hazard wall speed", String(editorHazardSpeed), (input) => {
                let v = parseFloat(input);
                if (isFinite(v) && v >= 0) setHazardSpeed(v);
            }, { maxLen: 6, filter: /[0-9.]/, hint: "Pixels per tick. 0 turns the wall off. The game's levels use 0.45 to 1.0." });
            break;

        case "CLEAR_MAP":
            askConfirm("Clear this level?", "Every object in this level will be removed.", () => {
                initBlankEditorGrid();
				editorTracks = []; activeTrackIdx = -1;
                renderEditor();
                commitEditorLevel();
            }, "CLEAR");
            break;
        case "CODE_MENU": openLevelCodePrompt(); break;
        case "TEST_PLAY":
            commitEditorLevel();
            customRun = { mode: "test", worldIdx: activeWorldIdx, levelIdx: activeLevelIdx };
            playCustomLevel();
            return;
        case "EXIT_EDITOR": exitEditor(); return;

        case "LV_PICK":
            commitEditorLevel();
            loadEditorLevel(activeWorldIdx, b.idx);
            editorPanel = null;
            renderEditor();
            break;
        case "LV_ADD":
            if (world.levels.length >= MAX_CUSTOM_LEVELS) { showMessage("Level limit", "A world can have up to " + MAX_CUSTOM_LEVELS + " levels."); break; }
            commitEditorLevel();
            world.levels.push(blankLevelData(editorTheme));
            loadEditorLevel(activeWorldIdx, world.levels.length - 1);
            editorPanel = null;
            renderEditor();
            break;
        case "LV_DUP":
            if (world.levels.length >= MAX_CUSTOM_LEVELS) { showMessage("Level limit", "A world can have up to " + MAX_CUSTOM_LEVELS + " levels."); break; }
            commitEditorLevel();
            world.levels.splice(activeLevelIdx + 1, 0, JSON.parse(JSON.stringify(world.levels[activeLevelIdx])));
            loadEditorLevel(activeWorldIdx, activeLevelIdx + 1);
            renderEditor();
            break;
        case "LV_DEL":
            if (world.levels.length <= 1) { showMessage("Can't delete", "A world needs at least one level."); break; }
            askConfirm("Delete level " + (activeLevelIdx + 1) + "?", "This level will be removed from the world.", () => {
                world.levels.splice(activeLevelIdx, 1);
                loadEditorLevel(activeWorldIdx, Math.min(activeLevelIdx, world.levels.length - 1));
                saveCustomWorlds();
                renderEditor();
            }, "DELETE");
            break;
        case "LV_LEFT":
        case "LV_RIGHT": {
            let to = activeLevelIdx + (b.action === "LV_LEFT" ? -1 : 1);
            if (to < 0 || to >= world.levels.length) break;
            commitEditorLevel();
            let tmp = world.levels[to];
            world.levels[to] = world.levels[activeLevelIdx];
            world.levels[activeLevelIdx] = tmp;
            activeLevelIdx = to;
            saveCustomWorlds();
            renderEditor();
            break;
        }
        case "LV_RENAME":
            askText("Name this level", world.levels[activeLevelIdx].name, (input) => {
                world.levels[activeLevelIdx].name = cleanName(input, "");
                saveCustomWorlds();
                renderEditor();
            }, { maxLen: 24, hint: "Leave it empty to use \"Level " + (activeLevelIdx + 1) + "\"." });
            break;
        case "LV_WRENAME":
            askText("Name this world", world.name, (input) => {
                world.name = cleanName(input, world.name);
                saveCustomWorlds();
                renderEditor();
            }, { maxLen: 24 });
            break;
		case "OPEN_TRACK":
            if (activeTrackIdx < 0 || !editorTracks[activeTrackIdx]) {
                showMessage("No track selected", "Select Moving Box or Moving Orb and drag across tiles to draw a track.");
                break;
            }
            editorPanel = "track";
            renderEditor();
            break;
        case "TR_SLIDER": setTrackSpeedFromX(mx); break;
        case "TR_STEP":   setTrackSpeed((editorTracks[activeTrackIdx]?.speed || 2.0) + b.delta); break;
        case "TR_SET":    setTrackSpeed(b.value); break;
        case "TR_TYPE":
            askText("Track obstacle speed", String(editorTracks[activeTrackIdx]?.speed || 2.0), (input) => {
                let v = parseFloat(input);
                if (isFinite(v) && v > 0) setTrackSpeed(v);
            }, { maxLen: 6, filter: /[0-9.]/, hint: "Pixels per tick (e.g. 1.0 = slow, 2.0 = medium, 4.0 = fast)." });
            break;
        case "TR_DELETE":
            if (activeTrackIdx >= 0) {
                editorTracks.splice(activeTrackIdx, 1);
                activeTrackIdx = editorTracks.length > 0 ? 0 : -1;
            }
            editorPanel = null;
            renderEditor();
            break;
    }
    if (GAME_STATE === "EDITOR") commitEditorLevel();
}

function handleEditorKey(e) {
    if (e.key === "Escape") {
        if (editorPanel) {
            editorPanel = null;
            renderEditor();

            exitEditor();
        }
        return;
    }

    if (e.key === "m" || e.key === "M") {
        editorPanel = editorPanel === "objects" ? null : "objects";
        renderEditor();

}
