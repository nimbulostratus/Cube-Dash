const LEVEL_CODE_PREFIX = "CD2";
const WORLD_CODE_PREFIX = "CDW1";
const LEVEL_CODE_TILES = ".#XCDKLFHTSP";
const B64_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

function bytesToB64(bytes) {
    let out = "";
    for (let i = 0; i < bytes.length; i += 3) {
        const b0 = bytes[i];
        const b1 = i + 1 < bytes.length ? bytes[i + 1] : 0;
        const b2 = i + 2 < bytes.length ? bytes[i + 2] : 0;
        const n = (b0 << 16) | (b1 << 8) | b2;
        out += B64_CHARS[(n >> 18) & 63] + B64_CHARS[(n >> 12) & 63];
        if (i + 1 < bytes.length) out += B64_CHARS[(n >> 6) & 63];
        if (i + 2 < bytes.length) out += B64_CHARS[n & 63];
    }
    return out;
}

function b64ToBytes(str) {
    const vals = [];
    for (const ch of str) {
        const v = B64_CHARS.indexOf(ch);
        if (v < 0) return null;
        vals.push(v);
    }
    if (vals.length % 4 === 1) return null;
    const bytes = [];
    for (let i = 0; i < vals.length; i += 4) {
        const n = (vals[i] << 18) | (vals[i + 1] << 12) | ((vals[i + 2] || 0) << 6) | (vals[i + 3] || 0);
        bytes.push((n >> 16) & 255);
        if (i + 2 < vals.length) bytes.push((n >> 8) & 255);
        if (i + 3 < vals.length) bytes.push(n & 255);
    }
    return bytes;
}

function levelChecksum(bytes) {
    let c = 7;
    for (const b of bytes) c = (c * 31 + b) & 255;
    return c;
}

function encodeLevelBytes(gridRows, theme, hazardSpeed, tracks) {
    const flat = gridRows.join("");
    const idx = [];
    for (const ch of flat) {
        const t = LEVEL_CODE_TILES.indexOf(ch);
        idx.push(t < 0 ? 0 : t);
    }
    const packed = [];
    for (let i = 0; i < idx.length; i += 2) {
        packed.push((idx[i] << 4) | (i + 1 < idx.length ? idx[i + 1] : 0));
    }
    const rle = [];
    for (let i = 0; i < idx.length;) {
        let j = i;
        while (j < idx.length && idx[j] === idx[i] && j - i < 16) j++;
        rle.push((idx[i] << 4) | (j - i - 1));
        i = j;
    }
    const useRle = rle.length < packed.length;
    const speed = Math.max(0, Math.min(9900, Math.round(hazardSpeed * 100)));
    const out = [useRle ? 1 : 0, theme, speed >> 8, speed & 255].concat(useRle ? rle : packed);

    // Append moving tracks (1 byte count + per track: type, speed*100 (2B), pointCount, 2B per (c, r))
    const validTracks = sanitizeTracks(tracks);
    out.push(validTracks.length);
    for (const tr of validTracks) {
        out.push(tr.type === "C" ? 1 : 0);
        const tSpd = Math.max(1, Math.min(9900, Math.round(tr.speed * 100)));
        out.push(tSpd >> 8, tSpd & 255);
        out.push(tr.points.length);
        for (const pt of tr.points) {
            out.push(pt.c, pt.r);
        }
    }
    return out;
}

function decodeLevelBytes(bytes, offset) {
    if (offset + 4 > bytes.length) return null;
    const mode = bytes[offset];
    const theme = bytes[offset + 1];
    if (mode > 1 || theme < 1 || theme > TOTAL_WORLDS) return null;
    const speed = ((bytes[offset + 2] << 8) | bytes[offset + 3]) / 100;
    const idx = [];
    let pos = offset + 4;
    while (idx.length < 300 && pos < bytes.length) {
        const b = bytes[pos++];
        if (mode === 0) {
            idx.push(b >> 4, b & 15);
        } else {
            const run = (b & 15) + 1;
            for (let k = 0; k < run; k++) idx.push(b >> 4);
        }
    }
    if (idx.length !== 300 || idx.some(t => t >= LEVEL_CODE_TILES.length)) return null;
    const flat = idx.map(t => LEVEL_CODE_TILES[t]).join("");
    const grid = [];
    for (let r = 0; r < 15; r++) {
        grid.push(flat.slice(r * 20, (r + 1) * 20));
    }
    const tracks = [];
    if (pos < bytes.length) {
        const trackCount = bytes[pos++];
        for (let t = 0; t < trackCount; t++) {
            if (pos + 4 > bytes.length) return null;
            const tType = bytes[pos++] === 1 ? "C" : "X";
            const tSpd = ((bytes[pos] << 8) | bytes[pos + 1]) / 100;
            pos += 2;
            const ptCount = bytes[pos++];
            if (ptCount < 2 || pos + ptCount * 2 > bytes.length) return null;
            const pts = [];
            for (let k = 0; k < ptCount; k++) {
                pts.push({ c: bytes[pos++], r: bytes[pos++] });
            }
            tracks.push({ type: tType, speed: tSpd, points: pts });
        }
    }
    return { theme, speed, grid, tracks, nextOffset: pos };
}

function pushTextBytes(arr, str) {
    const encoded = new TextEncoder().encode(str || "");
    const len = Math.min(255, encoded.length);
    arr.push(len);
    for (let i = 0; i < len; i++) arr.push(encoded[i]);
}

function readTextBytes(bytes, offset) {
    if (offset >= bytes.length) return null;
    const len = bytes[offset];
    if (offset + 1 + len > bytes.length) return null;
    const slice = new Uint8Array(bytes.slice(offset + 1, offset + 1 + len));
    return { text: new TextDecoder().decode(slice), nextOffset: offset + 1 + len };
}

function exportWorldCode() {
    commitEditorLevel();
    const world = customWorlds[activeWorldIdx];
    if (!world) {
        // Fallback if somehow outside a world
        const bytes = encodeLevelBytes(editorGrid.map(r => r.join("")), editorTheme, editorHazardSpeed);
        bytes.push(levelChecksum(bytes));
        return LEVEL_CODE_PREFIX + bytesToB64(bytes);
    }

    const bytes = [];
    pushTextBytes(bytes, world.name);
    bytes.push(world.levels.length);

    for (const lv of world.levels) {
        pushTextBytes(bytes, lv.name || "");
        const lvBytes = encodeLevelBytes(lv.grid, lv.theme, lv.speed, lv.tracks);
        for (const b of lvBytes) bytes.push(b);
    }

    bytes.push(levelChecksum(bytes));
    return WORLD_CODE_PREFIX + bytesToB64(bytes);
}

function importLevelCode(code) {
    code = String(code || "").replace(/\s+/g, "");
    const bad = (msg) => { showMessage("Invalid code boi", msg); return false; };

    // 1. FULL WORLD CODE ("CDW1...")
    if (code.indexOf(WORLD_CODE_PREFIX) === 0) {
        const bytes = b64ToBytes(code.slice(WORLD_CODE_PREFIX.length));
        if (!bytes || bytes.length < 8) return bad("boi that world code has invalid characters.");
        const checksum = bytes.pop();
        if (levelChecksum(bytes) !== checksum) return bad("boi that world code is incomplete or corrupted.");

        const wNameRes = readTextBytes(bytes, 0);
        if (!wNameRes || wNameRes.nextOffset >= bytes.length) return bad("boi thats an invalid world title.");
        const worldName = cleanName(wNameRes.text, "Imported World");
        let pos = wNameRes.nextOffset;

        const levelCount = bytes[pos++];
        if (levelCount < 1 || levelCount > MAX_CUSTOM_LEVELS) return bad("boi you have an invalid number of levels in the world.");

        const newLevels = [];
        for (let i = 0; i < levelCount; i++) {
            const lNameRes = readTextBytes(bytes, pos);
            if (!lNameRes) return bad("boi theres a corrupted level name at level " + (i + 1) + ".");
            pos = lNameRes.nextOffset;

            const lvData = decodeLevelBytes(bytes, pos);
            if (!lvData) return bad("boi theres corrupted map data at level " + (i + 1) + ".");
            pos = lvData.nextOffset;

            newLevels.push({
                name: cleanName(lNameRes.text, ""),
                grid: lvData.grid,
                theme: lvData.theme,
                speed: lvData.speed,
				tracks: lvData.tracks || []
            });
        }

        if (pos !== bytes.length) return bad("boi theres extra data after the code.");

        const world = customWorlds[activeWorldIdx];
        if (world) {
            world.name = worldName;
            world.levels = newLevels;
            loadEditorLevel(activeWorldIdx, 0);
            saveCustomWorlds();
        }
        return true;
    }

    // 2. SINGLE LEVEL CODES ("CD1|..." or "CD2...") -> Replaces only the current level
    let theme, speed, grid;
    if (code.indexOf("CD1|") === 0) {
        const parts = code.split("|");
        if (parts.length !== 4 || parts[3].length !== 300) return bad("boi that isn't a valid code.");
        theme = Math.max(1, Math.min(TOTAL_WORLDS, parseInt(parts[1]) || 1));
        speed = Math.max(0, parseFloat(parts[2]) || 0);
        grid = [];
        for (let r = 0; r < 15; r++) grid.push(parts[3].slice(r * 20, (r + 1) * 20));
    } else if (code.indexOf(LEVEL_CODE_PREFIX) === 0) {
        const bytes = b64ToBytes(code.slice(LEVEL_CODE_PREFIX.length));
        if (!bytes || bytes.length < 6) return bad("boi that code has invalid characters.");
        const checksum = bytes.pop();
        if (levelChecksum(bytes) !== checksum) return bad("boi that code is incomplete.");
        const decoded = decodeLevelBytes(bytes, 0);
        if (!decoded || decoded.nextOffset !== bytes.length) return bad("boi that data is the wrong size.");
        theme = decoded.theme;
        speed = decoded.speed;
        grid = decoded.grid;
        editorTracks = decoded.tracks || [];
        activeTrackIdx = editorTracks.length > 0 ? 0 : -1;
    } else {
        return bad("boi that litterally isn't even a valid code.");
    }

    editorTheme = theme;
    editorHazardSpeed = speed;
    if (speed > 0) editorLastSpeed = speed;
    editorGrid = grid.map(row => row.split(""));
    return true;
}

function openLevelCodePrompt() {
    let currentCode = exportWorldCode();
    showDialog({
        type: "code", title: "World code", value: currentCode, maxLen: 25000, note: "",
        compact: true, pasteReplaces: true,
        text: "Copy or paste your world code.",

            if (v && v.trim() !== currentCode && importLevelCode(v)) {
                renderEditor();
                commitEditorLevel();
            }
        },
        buttons: [
            { label: "CLOSE", color: "#555", run: "cancel" },
            { label: "COPY", color: "teal", run: (d) => {

                copyToClipboard(d.dom ? d.dom.value : d.value).then((ok2) => {

        ]
    });
}

function openImportWorldPrompt() {
    showDialog({
        type: "code", title: "Import World or Level", value: "", maxLen: 25000, note: "",
        compact: true, pasteReplaces: true,
        text: "Paste a world code or level code (CDW1, CD2...) and press IMPORT.",
        onOk: (v) => {
            if (!v || !v.trim()) return;
            // Create a temporary slot so importLevelCode can populate it cleanly
            const tempIndex = customWorlds.length;
            customWorlds.push({ name: "Imported World", levels: [blankLevelData(1)] });
            activeWorldIdx = tempIndex;
            activeLevelIdx = 0;

            if (importLevelCode(v)) {
                // If it was a single-level code (CD1/CD2), apply the decoded grid/theme/speed
                if (!v.trim().startsWith(WORLD_CODE_PREFIX)) {
                    commitEditorLevel();
                }
                saveCustomWorlds();
                customPage = Math.floor(tempIndex / 5);
                showCustomWorlds();
            } else {
                // Roll back the temporary world if the code was invalid
                customWorlds.pop();
                activeWorldIdx = -1;
            }
        },
        buttons: [
            { label: "CANCEL", color: "#555", run: "cancel" },
            { label: "IMPORT", color: "forestgreen", run: "ok" }
        ]
    });
}

function currentCustomData() {
    if (customRun.mode === "world") {
        let w = customWorlds[customRun.worldIdx];
        let lv = w && w.levels[customRun.levelIdx];
        if (lv) return { name: lv.name, grid: lv.grid, theme: lv.theme, speed: lv.speed, tracks: lv.tracks || [], count: w.levels.length };
    }
    let w = customWorlds[activeWorldIdx];
    let lv = w && w.levels[activeLevelIdx];
    return { name: lv ? lv.name : "", grid: editorGrid.map(r => r.join("")), theme: editorTheme, speed: editorHazardSpeed, tracks: sanitizeTracks(editorTracks), count: 1 };
}

function playCustomLevel(opts) {
    opts = opts || {};
    const keepRunning = opts.keepTime && isRunning;
    if (!keepRunning) {
        stopStopwatch();
    }
    clearEditorUI();
    clearMenuUI();
    clearLevel();

    let data = currentCustomData();
    let theme = WORLD_THEMES[data.theme] || DEFAULT_THEME;
    BACKGROUND_COLOR = theme.bg;
    WALL_COLOR = theme.wall;
    PLAYER_COLOR = theme.player;
    OBSTACLE_COLOR = "crimson";
    DOOR_COLOR = theme.door;
    GUI_COLOR = theme.gui;
    background.setColor(BACKGROUND_COLOR);

    GAME_STATE = "CUSTOM_PLAY";
    if (!opts.keepHp) hp = MAX_HP;
    if (!opts.keepTime) {
        movingLeft = movingRight = movingUp = movingDown = false;
        startTime = 0;
        elapsedTime = 0;
        isRunning = false;
    }
    isDash = false;
    canDash = true;
    isInvulnerable = false;
    timeFrozen = false;
    speedBoost = false;
    SPEED = 3.5;

    hideGameplayUI();
    initGUI();
    initPlayer();

    // Update the HUD immediately so it doesn't flash 00:00.00 between levels
    if (opts.keepTime && timeText) {
        update();
    }

    // Find spawn coordinates from the 'P' tile
    spawnX = 40;
    spawnY = (getHeight() / 2) - PLAYER_SIZE / 2;
    for (let r = 0; r < 15; r++) {
        for (let c = 0; c < 20; c++) {
            if (data.grid[r][c] === "P") {
                spawnX = c * TILE_SIZE + (TILE_SIZE - PLAYER_SIZE) / 2;
                spawnY = r * TILE_SIZE + (TILE_SIZE - PLAYER_SIZE) / 2;
            }
        }
    }
    // Load map without letting 'P' overwrite the spawn we just found
    let mapStrings = data.grid.map(row => row.replace("P", "."));
    loadMap(mapStrings);
    if (data.speed > 0) {
        addHazardWall(data.speed);
    }
	if (Array.isArray(data.tracks)) {
        for (const tr of data.tracks) {
            addTrackObstacle(tr.type, tr.points, tr.speed);
        }
    }
    let label = "";
    if (customRun.mode === "world") {
        label = data.name ? data.name : ("L " + (customRun.levelIdx + 1) + "/" + data.count);
    } else {
        label = data.name ? data.name : "EDIT";
    }
    levelText.setText(label);
    levelText.setPosition(getWidth() - 20 - levelText.getWidth(), 35);
    resetPlayerPos();
}

function restartCustomRun() {
    if (customRun.mode === "world") customRun.levelIdx = 0;
    playCustomLevel();
}

function customLevelCleared() {
    if (customRun.mode === "world") {
        let w = customWorlds[customRun.worldIdx];
        if (w && customRun.levelIdx + 1 < w.levels.length) {
            customRun.levelIdx++;
            playCustomLevel({ keepHp: true, keepTime: true });
            return;
        }
        stopStopwatch();
        let t = formatTime(elapsedTime);
        let isNewBest = false;
        if (w && elapsedTime > 0 && (!w.bestTime || elapsedTime < w.bestTime)) {
            w.bestTime = elapsedTime;
            saveCustomWorlds();
            isNewBest = true;
        }
        let msg = "\"" + (w ? w.name : "") + "\"  |  Time: " + t + (isNewBest ? "  (NEW BEST!)" : "");
        showMessage("World cleared!", msg, () => showCustomWorlds());
        return;
    }
    stopStopwatch();
    let t = formatTime(elapsedTime);
    showMessage("Level cleared!", "Time: " + t, () => openLevelEditor());
}

function exitCustomPlay() {
    resumeGame();
    if (customRun.mode === "world") showCustomWorlds();
    else openLevelEditor();
}

function loadMap(map) {
	spawnX = 40; 
	spawnY = (getHeight() / 2) - PLAYER_SIZE / 2;
    for (let row = 0; row < map.length; row++) {
        for (let column = 0; column < map[row].length; column++) {
            let tile = map[row][column];
            let x = column * TILE_SIZE;
            let y = row * TILE_SIZE;
            if (tile == "#") {
                addWall(x, y, TILE_SIZE, TILE_SIZE);
            } else if (tile == "X") {
                addObstacleRect(x, y, TILE_SIZE, TILE_SIZE);
            } else if (tile == "C") {
                addObstacleCirc(x + TILE_SIZE / 2, y + TILE_SIZE / 2, TILE_SIZE / 2);
            } else if (tile == "D") {
                addDoor(x, y, TILE_SIZE, TILE_SIZE);
            } else if (tile == "H") {
                addItem(x, y, "health");
            } else if (tile == "T") {
                addItem(x, y, "time");
            } else if (tile == "S") {
                addItem(x, y, "speed");
            } else if (tile == "L") {
                addLockedDoor(x, y, TILE_SIZE, TILE_SIZE);
            } else if (tile == "K") {
                addKey(x, y, false);
            } else if (tile == "F") {
                addKey(x, y, true);
            } else if (tile == "P") {
				spawnX = x + (TILE_SIZE - PLAYER_SIZE) / 2;
				spawnY = y + (TILE_SIZE - PLAYER_SIZE) / 2;
				curPlayerX = spawnX;
				curPlayerY = spawnY;
				if (player) player.setPosition(curPlayerX, curPlayerY);
			}
        }
    }
}
